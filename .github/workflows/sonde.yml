name: Sonde Orobnat (temporaire)
on:
  push:
    branches: [claude/prelevements-ma-commune]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q requests
      - run: python .github/sonde/sonde.py
