name: Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  # Release publiée seulement après les validations, depuis la version du manifest et ses notes
  # (.github/release-notes/v<version>.md) ; une version avec « b » est une pré-version
  release:
    needs: [hassfest, marketplace]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Version du manifest
        id: v
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/orobnat/manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *b*|*a*|*rc*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: Release déjà publiée ?
        id: existe
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "existe=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Créer le tag et la release
        if: steps.existe.outputs.existe != 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Qualité de l'eau (Orobnat) ${{ steps.v.outputs.version }}
          body_path: .github/release-notes/v${{ steps.v.outputs.version }}.md
          prerelease: ${{ steps.v.outputs.pre }}
